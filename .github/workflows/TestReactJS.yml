name: Test ReactJS web app
on: push
jobs:
  Configure_Env:
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch github repo
        uses: actions/checkout@v3
      - name: Install NodeJS for React
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Packages
        run: npm ci
      - name: Test React app
        run : npm test
      
